<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glitch-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E52521" stop-opacity="0"/>
    </radialGradient>
    <filter id="rgb-split">
      <feOffset in="SourceGraphic" dx="-2" dy="0" result="red"/>
      <feOffset in="SourceGraphic" dx="2" dy="0" result="blue"/>
      <feBlend in="red" in2="blue" mode="screen"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0A0A12" stroke="#E52521" stroke-width="4"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Spider Eyes / Emblem -->
  <path d="M22 36 L44 54 L38 68 L20 46 Z" fill="#FFFFFF" stroke="#0A0A12" stroke-width="2"/>
  <path d="M78 36 L56 54 L62 68 L80 46 Z" fill="#FFFFFF" stroke="#0A0A12" stroke-width="2"/>
  <path d="M50 42 L42 66 L50 82 L58 66 Z" fill="#E52521"/>
  <!-- Glitch slash -->
  <line x1="10" y1="52" x2="90" y2="48" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>
  <line x1="15" y1="50" x2="85" y2="50" stroke="#FFE600" stroke-width="1" opacity="0.6"/>
</svg>
